  <g fill="#1b1c22" stroke="#1b1c22" stroke-width="12" stroke-linejoin="round">
    <path d="M 358 168.6 L 115.8 264.7 L 202.3 290 L 329.9 176.2 Z"/>
    <path d="M 358 168.6 L 347.3 195.6 L 219.7 309.4 L 241.5 392.4 Z"/>
  </g>
</svg>
