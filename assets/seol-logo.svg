<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>seol logo</title>
  <!-- page: stroked outline with folded corner -->
  <g fill="none" stroke="#1b1c22" stroke-width="36" stroke-linejoin="round" stroke-linecap="round">
    <path d="M 75 52 H 345 L 437 148 V 460 H 75 Z"/>
    <path d="M 345 52 V 145 H 435"/>
  </g>
  <!-- paper plane: wing and keel as separate shapes so the fold
