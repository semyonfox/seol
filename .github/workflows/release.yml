name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: go vet ./...
      - run: go test -race ./...
      - run: test -z "$(gofmt -l cmd internal)"
      - run: npm pack --dry-run

  build:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            asset_arch: x64
          - goos: linux
            goarch: arm64
            asset_arch: arm64
          - goos: linux
            goarch: arm
            goarm: "7"
            asset_arch: armv7
          - goos: darwin
            goarch: amd64
            asset_arch: x64
          - goos: darwin
            goarch: arm64
            asset_arch: arm64
          - goos: windows
            goarch: amd64
            asset_arch: x64
            extension: .exe
          - goos: windows
            goarch: arm64
            asset_arch: arm64
            extension: .exe
          - goos: freebsd
            goarch: amd64
            asset_arch: x64
          - goos: freebsd
            goarch: arm64
            asset_arch: arm64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build native client
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          ASSET_ARCH: ${{ matrix.asset_arch }}
          EXTENSION: ${{ matrix.extension }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w -X github.com/semyonfox/seol/internal/app.version=${GITHUB_REF_NAME#v}" \
            -o "dist/seol_${GOOS}_${ASSET_ARCH}${EXTENSION}" ./cmd/seol
      - uses: actions/upload-artifact@v4
        with:
          name: seol-${{ matrix.goos }}-${{ matrix.asset_arch }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: seol-*
          path: dist
          merge-multiple: true
      - name: Create checksums
        run: cd dist && sha256sum seol_* > checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
